<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRIME SHOP — L'élégance rencontre le craft • Boutique Officielle</title>
    <meta name="description" content="Découvrez l'univers Prime Shop. Sélection exclusive d'électronique, accessoires et lifestyle avec livraison rapide à Cotonou et partout au Bénin." />
    
    <!-- Favicon: Modern Shop Violet Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='18' fill='%235433EB'/><path d='M13 14h8a5 5 0 0 1 0 10h-4v6h-4V14zm4 4v3h4a1.5 1.5 0 0 0 0-3h-4z' fill='%23FFFFFF'/><circle cx='27' cy='15' r='3.5' fill='%23A78BFA'/></svg>" />

    <!-- Google Fonts: Plus Jakarta Sans & Syne / Outfit for Editorial punch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&family=Cabinet+Grotesk:wght@700;800;900&display=swap" rel="stylesheet" />

    <style>
      :root {
        --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        --font-display: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
        --color-canvas-mist: #f2f4f5;
        --color-pure-white: #ffffff;
        --color-ink-black: #050508;
        --color-shop-violet: #5433eb;
        --color-violet-light: #ece7ff;
      }
      body {
        font-family: var(--font-sans);
        background-color: var(--color-canvas-mist);
        color: var(--color-ink-black);
        overflow-x: hidden;
      }
      /* Custom Lenis & Smooth Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f2f4f5;
      }
      ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
      }
    </style>
  </head>
  <body class="bg-[#f2f4f5] text-[#050508] min-h-screen selection:bg-[#5433eb] selection:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
